<div
  class="
    flex flex-col-reverse items-center gap-6
    w-full
    md:flex-row md:items-start md:justify-between md:gap-10
  "
>
  <div class="max-w-prose">
    <div
      class="
        flex flex-col gap-2 mb-8
        items-center md:items-start
      "
    >
      <p class="text-sm text-muted-color">
        {{ 'home.aboutMe.intro1' | translate }}
      </p>

      <h1 class="!text-4xl sm:!text-5xl !font-semibold tracking-tight text-primary">
        Julián Czerweny
      </h1>

      <p class="text-sm text-muted-color" [innerHTML]="'home.aboutMe.intro2' | translate"></p>
    </div>

    <p
      class="text-lg leading-relaxed text-pretty"
      [innerHTML]="'home.aboutMe.description' | translate"
    ></p>

    <div class="inline-flex text-sm text-muted-color mt-8">
      <span [innerHTML]="'home.aboutMe.note1' | translate"></span>
      <p-divider layout="vertical" styleClass="!py-0 !mx-2" />
      <span [innerHTML]="'home.aboutMe.note2' | translate"></span>
    </div>

  </div>

  <img
    src="/assets/images/me.png"
    alt="Julián Czerweny"
    class="
      shrink-0 size-28 md:size-52
      object-cover
      rounded-full md:rounded-xl
      border border-content-border-color
    "
  />
</div>
