<div
  class="
    relative
    flex items-center justify-center
    w-full aspect-square
    bg-form-field-background
    text-text-color
    font-bold
    select-none
  "
  (click)="onCellClick()"
  (contextmenu)="onCellRightClick($event)"
>

  <!-- Front Layer -->

  <div
    [id]="'front-layer-'+internalId"
    class="
      absolute inset-0
      flex items-center justify-center
      bg-content-hover-background
      z-10 overflow-hidden
    "
  >
    <div
      [id]="'flag-'+internalId"
      style="transform: scale(0);"
      class="
        flex items-center justify-center
        w-full h-full
        bg-amber-500/20
      "
    >
      <i class="text-amber-600 dark:text-amber-400 pi pi-flag-fill"></i>
    </div>
  </div>

  <!-- Back Layer -->

  @if (cellStore.isMine()) {
    <i class="absolute pi pi-circle-fill"></i>
    <i class="!text-xl pi pi-star-fill"></i>
  }
  @else if (cellStore.val() > 0) {
    <span
      [ngClass]="
        {
          'text-blue-600 dark:text-blue-400' : cellStore.val() == 1,
          'text-green-600 dark:text-green-400' : cellStore.val() == 2,
          'text-red-600 dark:text-red-400' : cellStore.val() == 3,
          'text-purple-600 dark:text-purple-400' : cellStore.val() == 4,
          'text-amber-600 dark:text-amber-400' : cellStore.val() == 5,
          'text-teal-600 dark:text-teal-400' : cellStore.val() == 6,
          'text-pink-600 dark:text-pink-400' : cellStore.val() == 7,
          'text-zinc-500 dark:text-zinc-400' : cellStore.val() == 8
        }"
    >
      {{ cellStore.val() }}
    </span>
  }
</div>
