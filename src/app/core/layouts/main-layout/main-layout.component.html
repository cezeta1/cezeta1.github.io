<div
  class="flex flex-col h-full max-h-screen w-full max-w-screen"
  [ngClass]="{ 'dark-mode': themeService.isDark() }"
>
  <nav-bar></nav-bar>

  <div class="flex flex-1 w-full max-w-screen px-2 sm:px-8 overflow-y-auto">
    <!-- Main content ribbon -->
    <div
      class="
        relative
        flex flex-col
        w-full max-w-5xl min-h-fit
        mx-auto
        p-4 pb-10 sm:p-8 sm:pb-10
        bg-content-background
        border-x border-content-border-color
      "
    >
      <div class="flex-1">
        <router-outlet />
      </div>
      <footer class="pt-0"></footer>
      <span class="absolute bottom-2 right-3 self-end text-muted-color opacity-20 text-xs">
        Version: {{ LIB_VERSION }}
      </span>
    </div>
    <p-scrolltop
      class="absolute bottom-6 right-6"
      target="parent"
      [buttonProps]="{ severity: 'secondary', outlined: true, rounded: true }"
    />
  </div>
</div>

<!-- Background -->
<div class="absolute -z-1000 top-0 left-0 background-pattern min-h-screen"></div>
