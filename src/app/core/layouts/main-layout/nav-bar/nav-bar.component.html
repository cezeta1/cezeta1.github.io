<p-toolbar
  styleClass="
    !relative !z-10 !px-2 !py-1 !rounded-none
    !border-x-0 !border-t-0
  "
>
  <ng-template #start>
    <div class="inline-flex items-center cursor-pointer" (click)="goHome()">
      <p-avatar
        [image]="avatarSrc()"
        class="mx-2"
        shape="circle"
      />

      <span class="text-lg font-bold">Cezeta.</span>
    </div>
  </ng-template>

  <ng-template #center>
    @if (showTabs()) {
      <nav class="inline-flex items-center gap-1">
        @for (tab of tabs(); track tab.route) {
          <a
            class="
              inline-flex items-center gap-2
              px-3 py-2
              text-sm font-medium text-muted-color
              border-b-2 border-transparent
              transition-colors
              hover:text-color
            "
            [routerLink]="'/'+tab.route"
            routerLinkActive="!text-primary !border-primary"
            [attr.aria-label]="tab.label | translate"
          >
            <i [class]="'pi ' + tab.icon"></i>
            <span class="hidden sm:inline">{{ tab.label | translate }}</span>
          </a>
        }
      </nav>
    }
  </ng-template>

  <ng-template #end>
    <div class="inline-flex gap-2 items-center justify-center">
      <lang-selector [transparent]="true"></lang-selector>
      <dark-mode-switch [rounded]="true"></dark-mode-switch>
    </div>
  </ng-template>
</p-toolbar>
