<!doctype html>
<html id="theme-anchor" lang="en">
  <head>
    <meta charset="utf-8">
    <title>Cezeta's Virtual Cyberdeck</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">
    <script>
      // Legacy hash URLs (/#/projects) → path URLs (/projects), before Angular boots
      if (location.hash.startsWith('#/')) history.replaceState(null, '', location.hash.slice(1));
    </script>
  </head>
  
  <script type="module" defer>
    import { polyfillCountryFlagEmojis } from "https://cdn.skypack.dev/country-flag-emoji-polyfill";
    polyfillCountryFlagEmojis();
  </script>

  <body 
    class="
      w-full h-full m-0
      min-w-full max-w-full
      min-h-full max-h-full
      bg-content-background 
      overflow-hidden
    "
  >
    <app-root class="block min-h-full h-[100vh]"></app-root>
  </body>
</html>
